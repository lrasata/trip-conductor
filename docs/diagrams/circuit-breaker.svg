<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="470" viewBox="0 0 1040 470">
<style>
text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
.title { font-size: 20px; font-weight: 600; fill: #222; }
.node { font-size: 15px; font-weight: 600; }
.sub { font-size: 12.5px; }
.edge { font-size: 12px; fill: #555; }
.note { font-size: 13px; fill: #555; }
.region { font-size: 14px; font-weight: 600; fill: #b8407f; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888"/></marker></defs>
<rect width="1040" height="470" fill="#ffffff"/>
<text class="title" x="520.0" y="40" text-anchor="middle">Circuit breaker, one per vendor</text>
<rect x="80" y="140" width="240" height="72" rx="10" fill="#e3f4ec" stroke="#2f8a62" stroke-width="1.5"/>
<text class="node" x="200.0" y="173.0" text-anchor="middle" fill="#145a3c">Closed</text>
<text class="sub" x="200.0" y="191.0" text-anchor="middle" fill="#2f8a62">calls go through, failures counted</text>
<rect x="720" y="140" width="240" height="72" rx="10" fill="#fbe9e9" stroke="#c0393b" stroke-width="1.5"/>
<text class="node" x="840.0" y="173.0" text-anchor="middle" fill="#7a1a1c">Open</text>
<text class="sub" x="840.0" y="191.0" text-anchor="middle" fill="#c0393b">fail fast, vendor not called</text>
<rect x="400" y="330" width="240" height="72" rx="10" fill="#fff4cc" stroke="#c79a00" stroke-width="1.5"/>
<text class="node" x="520.0" y="363.0" text-anchor="middle" fill="#6b5200">Half-open</text>
<text class="sub" x="520.0" y="381.0" text-anchor="middle" fill="#8a6a00">one probe call, others fail fast</text>
<polyline points="320,176 720,176" fill="none" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
<text class="edge" x="520" y="166" text-anchor="middle">5 failures within 60 s</text>
<text class="edge" x="520" y="196" text-anchor="middle">(timeouts, connection errors, 5xx)</text>
<polyline points="860,212 860,366 640,366" fill="none" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
<text class="edge" x="750" y="386" text-anchor="middle">after 30 s, one caller wins the probe</text>
<polyline points="600,330 600,280 800,280 800,212" fill="none" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
<text class="edge" x="700" y="272" text-anchor="middle">probe fails</text>
<polyline points="400,366 200,366 200,212" fill="none" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
<text class="edge" x="300" y="386" text-anchor="middle">probe succeeds</text>
<text class="note" x="40" y="432" text-anchor="start">State is one DynamoDB item per vendor, shared by every Lambda instance; each transition is a conditional write.</text>
<text class="note" x="40" y="452" text-anchor="start">A business refusal (no room, card declined) means the vendor is healthy: it doesn't count as a failure.</text>
</svg>
